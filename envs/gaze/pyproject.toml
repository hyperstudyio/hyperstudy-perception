[project]
name = "perception-env-gaze"
version = "0.1.0"
description = "Gaze targets (Gaze-LLE: frozen DINOv2 ViT-L/14 + gaze decoder) and active speakers (LR-ASD) on PyTorch"
requires-python = ">=3.12,<3.13"
# The bake-off's versions (tools/perception-bakeoff/gaze/uv.lock), so the heatmaps are the ones it measured. timm for
# the decoder's transformer blocks; torchvision for the input transform and the heatmap resize; OpenCV decodes frames
# exactly as the bake-off did. On Linux PyPI's torch 2.14 wheels are built for CUDA 13 (an NVIDIA driver >= 580).
# Not merged into envs/vision: torch pins its CUDA 13 libraries exactly (cuDNN 9.24, CUDA runtime 13.0), which would
# move onnxruntime-gpu's (cuDNN 9.27, runtime 13.4) under body pose.
# Active speakers (nodes/vision/active-speaker) ran in the bake-off on these same torch, numpy and OpenCV versions
# (tools/perception-bakeoff/asd/uv.lock), so it shares this lock: it adds scipy (the crop smoothing and the voice
# assignment), python_speech_features (the MFCCs LR-ASD was trained on; an sdist, pure Python) and PyAV (its 25 fps
# grey frames, through FFmpeg's own fps filter, with no ffmpeg program on the machine), moving no other package.
# PyAV 17.1.0, not the other environments' 16.1.0: it carries FFmpeg 8.1.1, the ffmpeg program the bake-off cut its
# grey crops with. 16.1.0's FFmpeg 8.0.1 converts limited-range YUV to grey differently (82% of OOO's pixels differ, by
# up to 3 levels); 17.1.0's frames are the program's, byte for byte.
dependencies = [
  "perception-node",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "timm==1.0.30",
  "opencv-python==5.0.0.93",
  "numpy",
  "pillow",
  "scipy==1.18.1",
  "python-speech-features==0.6",
  "av==17.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
perception-node = { path = "../../sdk", editable = true }
