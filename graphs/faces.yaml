# Decode and face tracks: the first graph timed on an NVIDIA GPU (cloud/skypilot/gpu-faces.yaml).
#   perception run graphs/faces.yaml --input video=PATH/TO/VIDEO.mp4
schema_version: 1
pipeline: perception-faces
inputs:
  video: {type: video.v1, uri: '../data/video.mp4'}   # relative to this file; usually set with --input
policy: {placement: local, privacy: local-only, max_cost_usd: 0, retries: 1}
nodes:
  - id: decode
    uses: core.decode@1.1.0
    inputs: {video: $inputs.video}
  - id: faces
    uses: vision.face-track@1.4.0
    inputs: {video: $inputs.video, media: $nodes.decode.media, shots: $nodes.decode.shots}
