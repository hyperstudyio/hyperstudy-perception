id: vision.body-pose
version: 1.0.0
stage: bodies
title: Body pose
description: Each person's 2D skeleton (133 whole-body keypoints, RTMW-l; people found by YOLOX-m), tracked within shots and linked to their face track
inputs: {video: video.v1, media: media.v1, shots: bundle.shots@0.1, faces: bundle.faces@0.1}
outputs: {bodies: bundle.bodies@0.1}
config:
  # the faces node's rate by default, so a body sample and a face sample share a timestamp (the face link needs both)
  fps: {type: number, exclusiveMinimum: 0, maximum: 30, default: 8, description: "frames sampled per second"}
runners:
  # RTMW on CoreML (an MLProgram), YOLOX on the CPU: see models.py
  - {kind: native, env: envs/vision, entry: node.py, accelerator: mps, platforms: [darwin/arm64]}
  # onnxruntime-gpu's CUDA provider: CUDA 12 and cuDNN 9 on the machine
  - {kind: native, env: envs/vision, entry: node.py, accelerator: cuda, platforms: [linux/amd64], minimum_vram_gb: 4}
  - {kind: native, env: envs/vision, entry: node.py, accelerator: cpu}
resources: {cpu_cores: 4, memory_gb: 4, gpu: shared}
# fetches the weights ahead of a run (perception setup)
prepare: prepare.py
models:
  - {id: "RTMW-l 384x288 (rtmw-dw-x-l_simcc-cocktail14_270e)",
     source: "https://download.openmmlab.com/mmpose/v1/projects/rtmw/onnx_sdk/rtmw-dw-x-l_simcc-cocktail14_270e-384x288_20231122.zip",
     sha256: bd033156e5104c4f5d2edfe0453e02661e30a2f3da453ec93c8764d561b83054, size_gb: 0.23,
     licence: "Apache-2.0 weights trained on Cocktail14 (COCO-WholeBody annotations research-only; Human-Art non-commercial)",
     licence_mode: academic-only}
  - {id: "YOLOX-m person detector (yolox_m_8xb8-300e_humanart)",
     source: "https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/yolox_m_8xb8-300e_humanart-c2c7a14a.zip",
     sha256: 3dea6513388889f0fff4b77bf7a26013600321b9eb9ceb0e9a400a82572f5f23, size_gb: 0.1,
     licence: "Apache-2.0 weights trained on Human-Art (non-commercial) and COCO", licence_mode: academic-only}
