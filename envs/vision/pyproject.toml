[project]
name = "perception-env-vision"
version = "0.1.0"
description = "Vision nodes on ONNX Runtime and MediaPipe: body pose (RTMW + YOLOX-m, via rtmlib), facing (MediaPipe Pose Landmarker)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "perception-node",
  "rtmlib==0.0.16",
  # CoreML and CPU on a Mac; CUDA on Linux: onnxruntime-gpu 1.31 is built for CUDA 13, whose runtime and cuDNN 9 its
  # cuda and cudnn extras install as wheels (loaded by onnxruntime.preload_dlls, models.py), so a machine needs only an
  # NVIDIA driver >= 580, as for the faces environment. The two packages are one module, so rtmlib's own onnxruntime
  # requirement is limited to where -gpu is not installed.
  "onnxruntime==1.31.0 ; sys_platform != 'linux'",
  "onnxruntime-gpu[cuda,cudnn]==1.31.0 ; sys_platform == 'linux'",
  "opencv-python==5.0.0.93",
  # facing: Pose Landmarker on the CPU (XNNPACK); wheels for macOS arm64, Linux x86_64/aarch64 and Windows
  "mediapipe==1.1.1",
  "numpy",
]

[tool.uv]
package = false
override-dependencies = ["onnxruntime==1.31.0 ; sys_platform != 'linux'"]

[tool.uv.sources]
perception-node = { path = "../../sdk", editable = true }
