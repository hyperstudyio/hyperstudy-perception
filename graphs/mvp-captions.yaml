# The Phase 1 graph plus shot captions through the Anthropic API: the first node that sends data off the machine
# and costs money. allow_upload names exactly what may leave; max_cost_usd caps the spend.
#   perception run graphs/mvp-captions.yaml --input video=PATH/TO/VIDEO.mp4 --allow-uploads
schema_version: 1
pipeline: perception-mvp-captions
inputs:
  video: {type: video.v1, uri: '../data/video.mp4'}
policy:
  placement: hybrid
  privacy: local-preferred
  allow_upload: [frames, faces, transcript]
  max_cost_usd: 0.50
  retries: 1
nodes:
  - id: decode
    uses: core.decode@1.0.0
    inputs: {video: $inputs.video}
  - id: asr
    uses: audio.asr@1.0.0
    inputs: {audio: $nodes.decode.audio, shots: $nodes.decode.shots}
  - id: faces
    uses: vision.face-track@1.1.0
    inputs: {video: $inputs.video, media: $nodes.decode.media, shots: $nodes.decode.shots}
  - id: captions
    uses: vlm.shot-captions@1.0.0
    inputs: {shots: $nodes.decode.shots, keyframes: $nodes.decode.keyframes, transcript: $nodes.asr.transcript,
             faces: $nodes.faces.faces, media: $nodes.decode.media}
