id: vision.active-speaker
version: 1.0.0
stage: speakers
title: Active speakers
description: Who on screen is speaking (LR-ASD scores per face track, against the audio) for each utterance, and which person each diarized voice is
# the diarized transcript (diarize's): its utterances are what the layer labels, and its voices what it links to people
inputs: {video: video.v1, audio: audio.wav.v1, shots: bundle.shots@0.1, faces: bundle.faces@0.1, transcript: bundle.transcript@0.1}
outputs: {speakers: bundle.speakers@0.1}
config:
  # a voice -> person link is trusted, and names the speaker of an utterance with no speaking face, at this share of
  # the voice's visible words or more (the bake-off's gate: OOO 72% right against 65% ungated)
  voice_link_min_share: {type: number, minimum: 0, maximum: 1, default: 0.3}
runners:
  # envs/gaze holds the bake-off's ASD versions (torch 2.14.1, numpy, OpenCV), plus scipy, python_speech_features, PyAV
  - {kind: native, env: envs/gaze, entry: node.py, accelerator: mps, platforms: [darwin/arm64]}
  # PyPI's torch 2.14 wheels for Linux are built for CUDA 13 (envs/gaze): an NVIDIA driver >= 580. Not yet run on a GPU
  - {kind: native, env: envs/gaze, entry: node.py, accelerator: cuda, platforms: [linux/amd64], minimum_vram_gb: 2}
  - {kind: native, env: envs/gaze, entry: node.py, accelerator: cpu}
resources: {cpu_cores: 2, memory_gb: 3, gpu: shared}   # 2.5 GB peak RSS on MPS (OOO)
# fetches the weights ahead of a run (perception setup)
prepare: prepare.py
models:
  - {id: "LR-ASD (finetuning_TalkSet: AVA-ActiveSpeaker, then TalkSet)",
     source: "https://raw.githubusercontent.com/Junhua-Liao/LR-ASD/1b6dcd2d8fc2895683de6508ec6294ec47d388ca/weight/finetuning_TalkSet.model",
     sha256: 6b4ef53694e874e96cf630198dc479c78aebb3993bbf166aee3d926dfe7d9342, size_gb: 0.0034,
     licence: "LR-ASD code MIT; the weights in its repository state no licence; trained on AVA-ActiveSpeaker, then TalkSet (VoxCeleb2 and LRS3), terms unverified (not cleared to mirror, PLAN.md §4)",
     licence_mode: needs-review}
