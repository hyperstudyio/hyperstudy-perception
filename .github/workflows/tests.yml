# Tests on every pull request and on main. Linux runners only (the repository is private, and macOS minutes cost ten
# times as much); nothing here needs a GPU, model weights, study media or secrets.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  orchestrator:
    name: Orchestrator (graph, store, coordinator, CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 25   # the suite took 14 min on this machine (2026-10-31); 15 cut it off on GitHub's runner
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: pytest
        working-directory: orchestrator
        run: uv run --locked pytest -q tests

  node-logic:
    name: Node logic without models (thumbnail choice, decode workers, media reading and crops)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # The face node's own environment pulls torch and py-feat (gigabytes); these tests need only numpy, PyAV (the
      # version the envs lock), Pillow, pyarrow (envs/gaze's, for the heatmaps side file), OpenCV (envs/gaze's version,
      # without its GUI: the objects steps' outlines and crops, which their split is checked on) and the node SDK. They
      # run with nothing on PATH: no ffmpeg is needed.
      - name: pytest
        run: uv run --no-project --with pytest --with numpy --with av==16.1.0 --with pillow --with pyarrow==26.0.0 --with opencv-python-headless==5.0.0.93 --with-editable ./sdk pytest -q nodes

  package:
    name: Package (built, installed as the app installs it, decoding with nothing but uv on PATH)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: scripts/build-dist.sh
      - run: scripts/smoke-package.sh orchestrator/dist/*.whl
