[project]
name = "perception-env-gaze"
version = "0.1.0"
description = "PyTorch 2.14 vision nodes: Gaze-LLE (gaze targets); SAM 3, DINOv3 and Claude Haiku (objects)"
requires-python = ">=3.12,<3.13"
# The bake-off's versions (tools/perception-bakeoff/gaze/uv.lock), so the heatmaps are the ones it measured. timm for
# the decoder's transformer blocks; torchvision for the input transform and the heatmap resize; OpenCV decodes frames
# exactly as the bake-off did. On Linux PyPI's torch 2.14 wheels are built for CUDA 13 (an NVIDIA driver >= 580).
# Not merged into envs/vision: torch pins its CUDA 13 libraries exactly (cuDNN 9.24, CUDA runtime 13.0), which would
# move onnxruntime-gpu's (cuDNN 9.27, runtime 13.4) under body pose.
# pyarrow writes the heatmaps side file (nodes/vision/gaze/heatmaps.py). Pinned exactly: its version names itself in
# the file's footer, so the same maps are the same bytes only on the same pyarrow.
# The objects node shares it: the bake-off's objects env (tools/perception-bakeoff/objects/uv.lock) had the same torch,
# torchvision, timm, numpy and pillow, so adding transformers (SAM 3 video needs 5.20), its tokenizer, the Anthropic SDK
# and PyAV moved no version Gaze-LLE runs on.
dependencies = [
  "perception-node",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "timm==1.0.30",
  "opencv-python==5.0.0.93",
  "numpy",
  "pillow",
  "pyarrow==26.0.0",
  "transformers==5.20.2",
  "tokenizers==0.23.3",
  "anthropic==2.1.0",
  "av==16.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
perception-node = { path = "../../sdk", editable = true }
