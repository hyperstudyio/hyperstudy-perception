id: test.work
version: 1.0.0
description: Sums inputs plus `add`; can sleep and fail on purpose (scheduler tests)
inputs: {a: json.v1}
outputs: {out: json.v1}
config:
  add: {type: number, default: 1}
  sleep: {type: number, default: 0}
  fail: {enum: [none, transient, crash, schema, internal, input], default: none}
  fail_until: {type: integer, default: 0}
  record_dir: {type: string}
runners:
  - {kind: self, entry: node.py}
resources: {cpu_cores: 1, memory_gb: 0.1}
models:
  - {id: test-model, licence_mode: commercial-ok}
