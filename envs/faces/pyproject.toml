[project]
name = "perception-env-faces"
version = "0.1.0"
description = "Face nodes: py-feat Detectorv2 (RetinaFace + multitask) and ArcFace identity clustering"
requires-python = ">=3.12,<3.13"
# pyarrow writes the raw side files (nodes/vision/face-track/pyfeat_raw.py). Pinned exactly: its version names itself
# in the file's footer, so the same values are the same bytes only on the same pyarrow.
dependencies = ["perception-node", "py-feat==2.1.5", "scikit-learn", "pillow", "av==16.1.0", "pyarrow==26.0.0"]

[tool.uv]
package = false

[tool.uv.sources]
perception-node = { path = "../../sdk", editable = true }
