[project]
name = "perception-env-audio"
version = "0.1.0"
description = "Audio nodes on Apple silicon: Parakeet TDT via MLX"
requires-python = ">=3.12,<3.13"
dependencies = ["perception-node", "parakeet-mlx==0.5.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv]
package = false

[tool.uv.sources]
perception-node = { path = "../../sdk", editable = true }
