id: test.optional
version: 1.0.0
description: a's value plus add, and b's when the graph connects b (an optional input)
inputs: {a: json.v1, b: json.v1}
optional_inputs: [b]
outputs: {out: json.v1}
config:
  add: {type: number, default: 1}
  record_dir: {type: string}
runners:
  - {kind: self, entry: node.py}
resources: {cpu_cores: 1, memory_gb: 0.1}
models:
  - {id: test-model, licence_mode: commercial-ok}
