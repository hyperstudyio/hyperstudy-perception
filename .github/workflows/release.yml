# Cut a release: push a tag vX.Y.Z of a commit on main whose orchestrator/pyproject.toml says version X.Y.Z. The package
# is built, installed and run as the annotator app runs it (scripts/smoke-package.sh), and a draft GitHub release is
# made with notes from the pull requests merged since the last release and the wheel and sdist attached. Nothing is
# published: publishing the draft (a person, in GitHub) is what uploads those same files to PyPI and adds the notes to
# the docs (publish.yml).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  draft:
    name: Build, check and draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # the draft release and its files
      id-token: write       # signing the files' build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: The tag is on main and names the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "$TAG is not a commit of main: release only what was merged" >&2; exit 1; }
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' orchestrator/pyproject.toml)
          [ "$TAG" = "v$version" ] || { echo "$TAG does not match orchestrator/pyproject.toml's version $version" >&2; exit 1; }
      - run: scripts/build-dist.sh
      - run: scripts/smoke-package.sh orchestrator/dist/*.whl
      # what publish.yml checks before uploading: these files, built and smoke-tested by this workflow from this tag
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: orchestrator/dist/*
      - name: Notes from the pull requests merged since the last release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md
          cat >> notes.md <<'EOF'

          ## Install

          ```sh
          uv tool install hyperstudy-perception     # or: pip install hyperstudy-perception
          perception doctor
          ```

          The HyperStudy Annotator app installs and updates it on its own.
          EOF
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "hyperstudy-perception $TAG" --notes-file notes.md orchestrator/dist/*
