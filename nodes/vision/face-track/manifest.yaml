id: vision.face-track
version: 1.4.0
stage: faces
title: Face tracks
description: Face tracks within shots, identity clusters across the video (py-feat + ArcFace), crops, per-sample landmarks, action units, emotions and pose (the detail side file), the per-sample 478-point face mesh (the mesh side file), the per-sample ArcFace identity embeddings (the embeddings side file), and the rest of py-feat's output as two raw Parquet side files (per sample the detection score, unrounded box, head translation, blendshapes and mesh depth; and every detected face no track holds, with all its values)
inputs: {video: video.v1, media: media.v1, shots: bundle.shots@0.1}
# pyfeat and untracked: layers/faces_pyfeat.parquet and layers/faces_untracked.parquet, what py-feat returned that the
# layer and the other side files do not keep (pyfeat_raw.py lists every column and where it is kept); the layer points
# at them with raw.pyfeat and raw.untracked
outputs: {faces: bundle.faces@0.1, detail: bundle.faces_detail@0.1, mesh: bundle.faces_mesh@0.1, embeddings: bundle.faces_embeddings@0.1,
          pyfeat: bundle.faces_pyfeat@0.1, untracked: bundle.faces_untracked@0.1, crops: assets.v1}
config:
  fps: {type: number, exclusiveMinimum: 0, maximum: 30, default: 8, description: "frames sampled per second"}
  cluster_threshold: {type: number, minimum: 0, maximum: 2, default: 0.65}
  batch_size: {type: integer, minimum: 1, default: 32}
  # Frame-decoding processes beside the detector (py-feat's DataLoader workers); null is automatic: 4 where workers
  # can be forked (Linux), none where they would be spawned (macOS). See loader.py. Workers do not change the output.
  num_workers: {type: [integer, "null"], minimum: 0, default: null}
runners:
  - {kind: native, env: envs/faces, entry: node.py, accelerator: mps, platforms: [darwin/arm64]}
  # The faces lock resolves PyPI's CUDA 13 torch wheels on Linux (needs an NVIDIA driver >= 580).
  - {kind: native, env: envs/faces, entry: node.py, accelerator: cuda, platforms: [linux/amd64], minimum_vram_gb: 8}
  - {kind: native, env: envs/faces, entry: node.py, accelerator: cpu}
  # TODO: [PERCEPTION-GRAPH] Phase 1 step 7 - CUDA image for linux/amd64 (pinned digest), validated against MPS output
  # Plan: docs/plans/GRAPH_MVP_PLAN.md#phase-1--local-mvp
resources: {cpu_cores: 4, memory_gb: 8, gpu: exclusive}
# fetches the weights ahead of a run (perception setup)
prepare: prepare.py
models:
  # py-feat fetches its weights from hf://py-feat/* on first use, through its own fallback logic: `plan` cannot check
  # them repository by repository, so no hf:// source is declared here for the cache check.
  - {id: "py-feat Detectorv2 (RetinaFace + multitask)", source: "py-feat==2.1.5 (weights from hf://py-feat)",
     licence: "py-feat code MIT; v2 weights non-commercial", licence_mode: academic-only}
  - {id: "ArcFace (InsightFace, via py-feat)", source: "py-feat==2.1.5", licence: research-only weights, licence_mode: academic-only}
