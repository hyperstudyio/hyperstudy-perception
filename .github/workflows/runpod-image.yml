# The RunPod image for perception's CUDA nodes (cloud/runpod/image), built when what goes into it changes and pushed
# to GHCR under its tag (tag.py: from those files). Public: software only, no repository code, weights or data.
name: RunPod image

on:
  push:
    paths:
      - cloud/runpod/image/**
      - envs/**/pyproject.toml
      - envs/**/uv.lock
      - sdk/pyproject.toml
      - .github/workflows/runpod-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push the RunPod image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tag and context (exactly the files that go into it)
        id: tag
        run: |
          echo "tag=$(python3 cloud/runpod/image/tag.py --context "$RUNNER_TEMP/context")" >> "$GITHUB_OUTPUT"
          find "$RUNNER_TEMP/context" -type f
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Built already?
        id: have
        run: |
          if docker manifest inspect "ghcr.io/${{ github.repository_owner }}/perception-runpod:${{ steps.tag.outputs.tag }}" > /dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Room for torch's CUDA wheels
        if: steps.have.outputs.built != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/build-push-action@v6
        if: steps.have.outputs.built != 'true'
        with:
          context: ${{ runner.temp }}/context
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/perception-runpod:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.description=Software for perception's CUDA nodes on RunPod (no code, weights or data)
      - name: Size
        if: steps.have.outputs.built != 'true'
        run: docker image ls "ghcr.io/${{ github.repository_owner }}/perception-runpod"
