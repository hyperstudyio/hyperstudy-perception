# The second of the three objects steps (vision.objects-names, this, vision.objects), which share their code in
# nodes/vision/objects (track.py here). New in the split of vision.objects 1.1.0, whose SAM 3 and DINOv3 work it does,
# unchanged: no API, no uploads, no Anthropic key.
id: vision.objects-track
version: 1.0.0
title: Object tracks
# a step of the objects feature: the app shows the three as one, Objects, and runs them together
part_of: vision.objects
description: The named things and the clothing on every posed person (SAM 3 inside each body's box), outlined and tracked within shots by SAM 3 with no people inside an object's outline, and embedded by DINOv3, for the objects layer
inputs:
  vocabulary: vocabulary.v1
  video: video.v1
  media: media.v1
  shots: bundle.shots@0.1
  faces: bundle.faces@0.1
  bodies: bundle.bodies@0.1
# tracks: the tracks, their embeddings, crops and crop-check images, and the masks side file's rows (object_tracks.py)
outputs: {tracks: object_tracks.v1}
# The bake-off's settings (objects/objects.py), where it says how each was chosen. Provisional, from two clips.
config:
  fps: {type: number, exclusiveMinimum: 0, maximum: 30, default: 6, description: "frames per second SAM 3 sees (its cost is per frame; 6 keeps fast bike motion trackable)"}
  # 3 at fps 6: every other frame, the slowest rate at which every moment is within 1/fps of a garment sample (the app
  # and the gaze node show an object sample within 1/fps of the time)
  clothing_fps: {type: number, exclusiveMinimum: 0, maximum: 30, default: 3, description: "frames per second at which each posed body is searched for clothing (a body crop costs about a SAM 3 frame); fps / clothing_fps must be a whole number"}
runners:
  # SAM 3 in bfloat16 on the Apple GPU, with CPU stand-ins for its CUDA-only post-processing (models.py)
  - {kind: native, env: envs/gaze, entry: ../objects/track.py, accelerator: mps, platforms: [darwin/arm64]}
  # PyPI's torch 2.14 wheels for Linux are built for CUDA 13 (an NVIDIA driver >= 580). Not yet run on a GPU, here or in
  # the bake-off
  - {kind: native, env: envs/gaze, entry: ../objects/track.py, accelerator: cuda, platforms: [linux/amd64], minimum_vram_gb: 16}
  - {kind: native, env: envs/gaze, entry: ../objects/track.py, accelerator: cpu}
# memory: the models and the work, plus a SAM 3 session that holds every frame of a shot: ~31 MB a 1080p frame while it
# is made, 6 MB after (budget.py). 16 GB holds shots up to about 45 s at 6 fps; a longer shot needs more, and one this
# machine cannot hold at all fails the step at the start
resources: {cpu_cores: 4, memory_gb: 16, gpu: exclusive}
# Nothing leaves the machine: the crops it makes for the crop check are the objects step's to send
privacy: {external_upload: []}
# both models are gated on Hugging Face. The token is a run-time secret for now (check_access and the loads read it), so
# the step is not run on another machine (backends/remote.py); RUN_ANYWHERE_PLAN.md phase 5 makes it the download's only
secrets: [HF_TOKEN]
# fetches the weights ahead of a run (perception setup)
prepare: ../objects/prepare.py
models:
  - {id: facebook/sam3, source: "hf://facebook/sam3@3c879f39826c281e95690f02c7821c4de09afae7",
     revision: 3c879f39826c281e95690f02c7821c4de09afae7, size_gb: 3.44, gated: true,
     licence: "SAM License (Meta; gated on Hugging Face): commercial use permitted; acknowledge use in publications; trade-control, no-reverse-engineering and indemnity terms",
     licence_mode: commercial-ok}
  - {id: facebook/dinov3-vitl16-pretrain-lvd1689m,
     source: "hf://facebook/dinov3-vitl16-pretrain-lvd1689m@ea8dc2863c51be0a264bab82070e3e8836b02d51",
     revision: ea8dc2863c51be0a264bab82070e3e8836b02d51, size_gb: 1.21, gated: true,
     licence: "DINOv3 License (Meta; gated on Hugging Face): commercial use permitted; acknowledge use in publications; redistribution only under the same licence with a copy of it; trade-control, no-reverse-engineering and indemnity terms; Meta may amend the terms",
     licence_mode: commercial-ok}
