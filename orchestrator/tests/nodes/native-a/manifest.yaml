id: test.native-a
version: 1.0.0
description: test.work in a uv environment (envs/core), for the environment a host shares among nodes (test_remote)
inputs: {a: json.v1}
outputs: {out: json.v1}
config:
  add: {type: number, default: 1}
  sleep: {type: number, default: 0}
  fail: {enum: [none, transient, crash, schema, internal, input, oom, prepare], default: none}
  fail_until: {type: integer, default: 0}
  record_dir: {type: string}
runners:
  - {kind: native, env: envs/core, entry: ../work/node.py}
resources: {cpu_cores: 1, memory_gb: 0.1}
prepare: ../work/prepare.py
models:
  - {id: test-model, licence_mode: commercial-ok}
