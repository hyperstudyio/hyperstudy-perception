id: test.gpu
version: 1.0.0
description: test.work as a GPU-exclusive node (two never overlap)
inputs: {a: json.v1}
outputs: {out: json.v1}
config:
  add: {type: number, default: 1}
  sleep: {type: number, default: 0}
  fail: {enum: [none, transient, crash, schema, internal, input], default: none}
  fail_until: {type: integer, default: 0}
  record_dir: {type: string}
runners:   # on a machine with CUDA (as placement sees it: the tests' stand-ins), it runs "on" the card; else on the CPU
  - {kind: self, entry: ../work/node.py, accelerator: cuda}
  - {kind: self, entry: ../work/node.py}
resources: {cpu_cores: 1, memory_gb: 0.1, gpu: exclusive}
models:
  - {id: test-model, licence_mode: commercial-ok}
