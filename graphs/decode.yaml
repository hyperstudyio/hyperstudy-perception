# Decode only: the smallest real graph, used for backend smoke tests (cloud/skypilot/smoke.yaml).
#   perception run graphs/decode.yaml --input video=PATH/TO/VIDEO.mp4
schema_version: 1
pipeline: perception-decode
inputs:
  video: {type: video.v1, uri: '../data/video.mp4'}   # relative to this file; usually set with --input
policy: {placement: local, privacy: local-only, max_cost_usd: 0, retries: 1}
nodes:
  - id: decode
    uses: core.decode@1.1.0
    inputs: {video: $inputs.video}
