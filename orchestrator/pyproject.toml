[project]
name = "hyperstudy-perception"
version = "0.1.0"
description = "Perception graph orchestrator: runs video perception nodes locally, in containers, on cloud GPUs and model APIs, and publishes track bundles"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "perception-node",
]

[project.scripts]
perception = "perception.cli:main"

[tool.uv.sources]
perception-node = { path = "../sdk", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perception"]

[tool.pytest.ini_options]
testpaths = ["tests"]
