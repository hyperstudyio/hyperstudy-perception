<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perception track review</title>
<style>
/* Colours are HyperStudy's design tokens. */
:root {
  --color-primary: #4caf50; --color-primary-hover: #388e3c; --color-primary-light: rgba(76,175,80,.12);
  --color-danger: #f44336; --color-caution: #fbbf24; --color-caution-light: rgba(251,191,36,.12); --color-info: #2196f3;
  --color-bg-base: #121212; --color-bg-surface: #1c1c1c; --color-bg-input: #1f1f1f; --color-bg-elevated: #252525;
  --color-bg-card: #2c2c2c; --color-bg-hover: #333; --color-border-default: #333; --color-border-strong: #444;
  --color-text-primary: #e0e0e0; --color-text-secondary: #b0b0b0; --color-text-muted: #999;
  --label-w: 168px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--color-bg-base); color: var(--color-text-primary); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--color-bg-card); border: 1px solid var(--color-border-strong); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--color-bg-hover); }
button.primary { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
button.primary:hover { background: var(--color-primary-hover); }
button.on { border-color: var(--color-primary); background: var(--color-primary-light); }
button.link { background: none; border: 0; padding: 0; color: var(--color-info); }
button:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=number], select, textarea { background: var(--color-bg-input); border: 1px solid var(--color-border-strong); border-radius: 6px; padding: 4px 8px; }
textarea { width: 100%; resize: vertical; min-height: 54px; }
kbd { background: var(--color-bg-card); border: 1px solid var(--color-border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font: 11px ui-monospace, monospace; }

header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--color-bg-surface); border-bottom: 1px solid var(--color-border-default); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header .sub { color: var(--color-text-muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .count { color: var(--color-text-secondary); }

.workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: minmax(0, 1fr) auto; }
.stage { display: flex; flex-direction: column; min-height: 0; padding: 12px 12px 8px 16px; }
.video-wrap { position: relative; flex: 1; min-height: 200px; background: #000; border-radius: 8px; overflow: hidden; }
video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
.transport { display: flex; align-items: center; gap: 10px; padding-top: 8px; color: var(--color-text-secondary); flex-wrap: wrap; }
.transport .time { font-variant-numeric: tabular-nums; min-width: 128px; }
.transport .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border: 1px solid var(--color-border-strong); border-radius: 999px; cursor: pointer; user-select: none; font-size: 12px; }
.chip input { display: none; }
.chip:has(input:checked) { border-color: var(--color-primary); background: var(--color-primary-light); color: var(--color-text-primary); }

aside { grid-row: 1 / 3; grid-column: 2; border-left: 1px solid var(--color-border-default); background: var(--color-bg-surface); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--color-border-default); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: none; padding: 9px 2px; color: var(--color-text-secondary); border-bottom: 2px solid transparent; }
.tabs button.active { color: var(--color-text-primary); border-bottom-color: var(--color-primary); }
.panel { flex: 1; overflow-y: auto; padding: 14px 16px; }
.panel h2 { font-size: 15px; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
.panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-muted); margin: 16px 0 6px; font-weight: 600; }
.meta { color: var(--color-text-muted); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.crop { width: 96px; height: 96px; border-radius: 8px; object-fit: cover; background: var(--color-bg-card); flex: none; cursor: zoom-in; }
.crop.sm { width: 36px; height: 36px; border-radius: 6px; }
.crop.xs { width: 24px; height: 24px; border-radius: 4px; }
.list { display: flex; flex-direction: column; gap: 4px; }
.item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; background: var(--color-bg-elevated); border: 1px solid transparent; cursor: pointer; text-align: left; width: 100%; }
.item:hover { background: var(--color-bg-hover); }
.item.selected { border-color: var(--color-primary); }
.item.done { opacity: .5; }
.item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shot-group { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; color: var(--color-text-secondary); cursor: pointer; }
.shot-group img { width: 64px; height: 36px; object-fit: cover; border-radius: 4px; }
.choice { display: flex; gap: 6px; flex-wrap: wrap; }
.choice button { padding: 4px 8px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.toggle input { display: none; }
.toggle .track { width: 30px; height: 17px; border-radius: 9px; background: var(--color-border-strong); position: relative; transition: background .15s; flex: none; }
.toggle .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: left .15s; }
.toggle input:checked + .track { background: var(--color-primary); }
.toggle input:checked + .track::after { left: 15px; }
.flag { color: var(--color-caution); font-size: 12px; font-weight: 500; }
.callout { background: var(--color-caution-light); border-radius: 6px; padding: 6px 8px; margin: 8px 0; }
.callout.info { background: var(--color-primary-light); }
.help { color: var(--color-text-muted); font-size: 12px; border-top: 1px solid var(--color-border-default); padding: 8px 16px; line-height: 1.8; }
.empty { color: var(--color-text-muted); }
.prosody-table { border-collapse: collapse; width: 100%; margin: 4px 0 8px; }
.prosody-table th { text-align: left; font-weight: 500; color: var(--color-text-muted); padding: 2px 8px 2px 0; white-space: nowrap; vertical-align: top; }
.prosody-table td { padding: 2px 0; }
.prosody-words { margin: 2px 0 8px; line-height: 1.7; }
.prosody-words .prominent { background: var(--color-caution-light); color: var(--color-caution); border-radius: 3px; padding: 0 2px; }
.prosody-caption { border: 1px solid var(--color-border-default); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
.prosody-caption .tags { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
.prosody-caption .tag { background: var(--color-bg-card); border-radius: 4px; padding: 0 6px; font-size: 12px; color: var(--color-text-secondary); }
.editable { cursor: text; border-bottom: 1px dashed transparent; }
.editable:hover { border-bottom-color: var(--color-text-muted); }
input.inline-name { padding: 1px 6px; width: 100%; min-width: 0; font-weight: 600; }
.bars { display: grid; grid-template-columns: 58px 1fr 36px; gap: 2px 8px; align-items: center; font-size: 12px; }
.bars .fill { height: 8px; border-radius: 4px; background: var(--color-info); min-width: 1px; }
.bars .val { color: var(--color-text-muted); text-align: right; font-variant-numeric: tabular-nums; }
.stage-card { border: 1px solid var(--color-border-default); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
.stage-card table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
.stage-card td { padding: 2px 0; vertical-align: top; }
.stage-card td:last-child { text-align: right; color: var(--color-text-muted); white-space: nowrap; padding-left: 8px; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--color-border-strong); color: var(--color-text-secondary); }
.badge.academic { border-color: var(--color-caution); color: var(--color-caution); }
.badge.commercial { border-color: var(--color-primary); color: var(--color-primary); }

.timeline { grid-column: 1; border-top: 1px solid var(--color-border-default); background: var(--color-bg-surface); }
.tl-tools { display: flex; align-items: center; gap: 10px; padding: 6px 16px; color: var(--color-text-secondary); }
#tl-scroll { position: relative; overflow: auto; max-height: 42vh; }
#tl-content { position: relative; width: max-content; min-width: 100%; }
.lane { display: flex; border-bottom: 1px solid var(--color-border-default); }
.lane.drop-target { background: var(--color-primary-light); }
.lane-label { position: sticky; left: 0; z-index: 3; width: var(--label-w); flex: none; padding: 3px 6px 3px 16px; background: var(--color-bg-surface); color: var(--color-text-secondary); display: flex; align-items: center; gap: 6px; border-right: 1px solid var(--color-border-default); overflow: hidden; white-space: nowrap; }
.lane-label .name { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.lane-label.clickable { cursor: pointer; }
.lane-label.clickable:hover .name { color: var(--color-text-primary); }
.lane-label .crop { width: 20px; height: 20px; border-radius: 4px; cursor: pointer; }
.lane-label .hide { visibility: hidden; background: none; border: 0; padding: 0 2px; color: var(--color-text-muted); line-height: 1; }
.lane-label:hover .hide { visibility: visible; }
.lane-label .hide:hover { color: var(--color-text-primary); }
.lane.group .lane-label { color: var(--color-text-primary); font-weight: 600; padding-left: 6px; cursor: pointer; background: var(--color-bg-elevated); }
.lane.group { background: var(--color-bg-elevated); }
.lane.group .chev { width: 10px; color: var(--color-text-muted); }
.lane.group .lane-label .restore { font-weight: 400; }
.lane-body { position: relative; flex: none; cursor: crosshair; }
.lane-body .hint { position: absolute; left: 8px; top: 4px; color: var(--color-text-muted); font-size: 11px; pointer-events: none; }
.bar { position: absolute; height: 16px; border-radius: 4px; font-size: 11px; line-height: 16px; padding: 0 4px; overflow: hidden; white-space: nowrap; text-overflow: clip; cursor: pointer; color: #111; }
.bar.vis { height: 6px; opacity: .55; border-radius: 3px; }
.bar.speech { cursor: grab; }
.bar.excluded { background: transparent !important; border: 1px dashed var(--color-text-muted); color: var(--color-text-muted); }
.bar.unconfirmed { outline: 1px dashed var(--color-text-muted); outline-offset: -1px; }
.bar.flagged { box-shadow: inset 0 -3px 0 var(--color-caution); }
.bar.selected { outline: 2px solid #fff; outline-offset: 0; z-index: 2; opacity: 1; }
.bar.shot { background: var(--color-bg-card); color: var(--color-text-muted); border-radius: 0; border-right: 2px solid var(--color-bg-base); }
.bar.shot.odd { background: var(--color-bg-elevated); }
.bar.neutral { background: #8a8a8a; }
.bar.summary { opacity: .5; pointer-events: none; }
.lane.ruler .lane-body { cursor: ew-resize; }
.tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--color-border-strong); color: var(--color-text-muted); font-size: 10px; padding-left: 3px; }
.cut { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.12); pointer-events: none; z-index: 1; }
#playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--color-primary); pointer-events: none; z-index: 4; }
.marking { position: absolute; top: 0; bottom: 0; background: rgba(33,150,243,.18); pointer-events: none; z-index: 1; }
.ghost { position: fixed; z-index: 30; pointer-events: none; padding: 2px 8px; border-radius: 4px; color: #111; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.5); }

.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; padding: 32px; }
.lightbox .box { background: var(--color-bg-surface); border: 1px solid var(--color-border-strong); border-radius: 10px; max-width: min(1100px, 100%); max-height: 100%; overflow: auto; padding: 16px 20px 20px; }
.lightbox h2 { margin: 0 0 4px; font-size: 16px; display: flex; gap: 12px; align-items: center; }
.lightbox .big { max-width: 100%; max-height: 60vh; border-radius: 8px; display: block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.grid figure { margin: 0; cursor: pointer; }
.grid img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 6px; display: block; border: 2px solid transparent; }
.grid figure:hover img { border-color: var(--color-primary); }
.grid figcaption { font-size: 11px; color: var(--color-text-muted); margin-top: 3px; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--color-bg-card); border: 1px solid var(--color-border-strong); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 40; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Perception track review</h1>
  <span class="sub" id="sub"></span>
  <span class="count" id="count"></span>
  <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="import">Import</button>
  <button id="export" class="primary">Export corrections</button>
  <input type="file" id="file" accept="application/json" hidden>
</header>

<div class="workspace">
  <section class="stage">
    <div class="video-wrap">
      <video id="video" src="__VIDEO_SRC__" preload="auto" playsinline></video>
      <canvas id="overlay"></canvas>
    </div>
    <div class="transport">
      <button id="play" style="min-width:64px">Play</button>
      <span class="time" id="time"></span>
      <span id="shotinfo"></span>
      <span class="spacer"></span>
      <span id="layers"></span>
      <label>Speed <select id="speed"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.5</option><option>2</option></select></label>
    </div>
  </section>

  <aside>
    <nav class="tabs" id="tabs">
      <button data-tab="inspect" class="active">Inspect</button>
      <button data-tab="review">Review</button>
      <button data-tab="people">People</button>
      <button data-tab="notes">Annotate</button>
      <button data-tab="data">Data</button>
    </nav>
    <div class="panel" id="panel"></div>
    <div class="help" id="help"></div>
  </aside>

  <section class="timeline">
    <div class="tl-tools">
      <span>Timeline</span>
      <span id="group-chips" class="row" style="margin:0;gap:6px"></span>
      <span style="flex:1"></span>
      <span class="meta">drag speech onto another person to reassign it</span>
      <span id="hidden-rows"></span>
      <label>Zoom <input type="range" id="zoom" min="1" max="12" step="0.5" value="1"></label>
    </div>
    <div id="tl-scroll"><div id="tl-content"></div></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('overlay'), ctx = canvas.getContext('2d');
const STORE = `perception-corrections:${DATA.sha256}`;
const VIEW_STORE = `perception-view:${DATA.sha256}`;   // per-viewer layout only (hidden rows, overlays), never corrections
const EDGE = 0.5 / DATA.face_fps;     // a sampled track is drawn half a sample gap past its ends
const UNCERTAIN_GAP = 1.0;            // LR-ASD top-two gap below which an utterance is queued (holds 6 of 7 errors on OOO)
const SIMILAR_DISTANCE = 0.75;        // ArcFace centroid distance below which two people are suggested as one
const NOT_PERSON = '__not_person';
const PALETTE = ['#4caf50', '#3b82f6', '#f59e0b', '#ec4899', '#14b8a6', '#a78bfa', '#ef4444', '#84cc16', '#06b6d4', '#f97316', '#e879f9', '#facc15'];
const AU_NAMES = { AU01: 'inner brow raise', AU02: 'outer brow raise', AU04: 'brow lower', AU05: 'upper lid raise', AU06: 'cheek raise',
  AU07: 'lid tighten', AU09: 'nose wrinkle', AU10: 'upper lip raise', AU11: 'nasolabial deepen', AU12: 'lip corner pull (smile)',
  AU14: 'dimple', AU15: 'lip corner depress', AU17: 'chin raise', AU20: 'lip stretch', AU23: 'lip tighten', AU24: 'lip press',
  AU25: 'lips part', AU26: 'jaw drop', AU28: 'lip suck', AU43: 'eyes closed' };
const VALUE_KINDS = { binary: 'Yes / no', category: 'Category', number: 'Number', text: 'Text' };
const tracksById = new Map(DATA.tracks.map(t => [t.id, t]));
const uttsById = new Map(DATA.utterances.map(u => [u.id, u]));
const trackCrop = id => `annotator_crops/track_${id}.jpg`;

// ---------- corrections: an op log folded over the machine track ----------
let ops = [];
try { ops = JSON.parse(localStorage.getItem(STORE) || '[]'); } catch { ops = []; }
let S;
function fold() {
  S = { names: {}, voiceNames: {}, mergedInto: {}, created: [], trackPerson: {}, uttSpeaker: {}, uttText: {}, caption: {},
        included: {}, category: {}, distinct: new Set(), types: [], notes: new Map(),
        objNames: {}, objMergedInto: {}, objTrackIdentity: {}, userObjects: [] };
  for (const op of ops) {
    switch (op.op) {
      case 'person.create': S.created.push(op.person); S.names[op.person] = op.name; break;
      case 'person.rename': S.names[op.person] = op.name; break;
      case 'person.merge': { const a = root(op.from), b = root(op.into); if (a !== b) S.mergedInto[a] = b; break; }
      case 'person.not_person': { const a = root(op.person); if (a !== NOT_PERSON) S.mergedInto[a] = NOT_PERSON; break; }
      case 'person.distinct': S.distinct.add(pairKey(op.a, op.b)); break;
      case 'voice.rename': S.voiceNames[op.voice] = op.name; break;
      case 'object.create': S.userObjects.push(op.track); break;
      case 'object.rename': S.objNames[op.identity] = op.name; break;
      case 'object.merge': { const a = oroot(op.from), b = oroot(op.into); if (a !== b) S.objMergedInto[a] = b; break; }
      case 'object.assign': S.objTrackIdentity[op.track] = op.identity; break;
      case 'track.assign': S.trackPerson[op.track] = op.person; break;
      case 'utterance.speaker': if (op.speaker) S.uttSpeaker[op.utt] = op.speaker; else delete S.uttSpeaker[op.utt]; break;
      case 'utterance.text': S.uttText[op.utt] = op.text; break;
      case 'shot.caption': S.caption[op.shot] = op.caption; break;
      case 'entity.include': S.included[op.id] = op.included; break;
      case 'category.include': S.category[`${op.kind}:${op.label}`] = op.included; break;
      // types made before value kinds existed carried only `options`: categories if any, else free text
      case 'annotation.type': S.types.push({ kind: op.type.options?.length ? 'category' : 'text', ...op.type }); break;
      case 'annotation.add': S.notes.set(op.note.id, { ...op.note }); break;
      case 'annotation.edit': if (S.notes.has(op.id)) Object.assign(S.notes.get(op.id), op.fields); break;
      case 'annotation.delete': S.notes.delete(op.id); break;
    }
  }
}
// Every open tab of this page shares one stored log. A tab must build on what is stored, never on the copy it
// loaded: otherwise a tab opened earlier overwrites everything another tab saved since.
function readStoredOps() { try { return JSON.parse(localStorage.getItem(STORE) || '[]'); } catch { return null; } }
function commit(...newOps) {
  const stored = readStoredOps();
  if (stored) ops = stored;
  const at = new Date().toISOString();
  for (const op of newOps) ops.push({ ...op, at });
  persist(); fold(); render();
}
window.addEventListener('storage', e => {   // another tab saved: show its log here too
  if (e.key !== STORE) return;
  ops = e.newValue ? JSON.parse(e.newValue) : [];
  fold(); render();
});
function undo() {   // ops committed together share a timestamp and undo together
  const stored = readStoredOps();
  if (stored) ops = stored;
  if (!ops.length) return;
  const at = ops[ops.length - 1].at;
  while (ops.length && ops[ops.length - 1].at === at) ops.pop();
  persist(); fold(); render(); toast('Undone');
}
function persist() { try { localStorage.setItem(STORE, JSON.stringify(ops)); } catch { toast('Could not save in this browser; export to keep your work'); } }
const pairKey = (a, b) => [a, b].sort().join('|');
function root(p) { let seen = 0; while (S.mergedInto[p] && seen++ < 1000) p = S.mergedInto[p]; return p; }
const personOf = track => root(S.trackPerson[track.id] ?? track.person);
const special = p => p === 'Unknown' || p === NOT_PERSON;
const nameOf = p => p === NOT_PERSON ? 'Not a person' : p === 'Unknown' ? 'Unknown' : (S.names[p] || p);
const voiceName = v => v ? (S.voiceNames[v] || v) : 'Unnamed voice';
const machineLabel = p => S.names[p] ? `${S.names[p]} (${p})` : p;   // tells apart two people given the same name

// Objects (objects.json, plus ones segmented by clicking) work like people: tracks within a shot, identities across shots.
const OBJ = DATA.objects || { tracks: [], identities: [], fps: 6 };
const objectTracks = () => [...OBJ.tracks, ...S.userObjects];
const objTrack = id => objectTracks().find(o => o.id === id);
function oroot(i) { let seen = 0; while (S.objMergedInto[i] && seen++ < 1000) i = S.objMergedInto[i]; return i; }
const identityOf = o => oroot(S.objTrackIdentity[o.id] ?? o.identity);
const objName = i => S.objNames[i] || (i.startsWith('user:') ? 'New object' : i);
function objectIdentities() {
  const secs = {};
  for (const o of objectTracks()) { const i = identityOf(o); secs[i] = (secs[i] || 0) + o.end - o.start; }
  return Object.keys(secs).sort((a, b) => secs[b] - secs[a]);
}
function objCrop(i) {
  const own = OBJ.identities.find(x => x.id === i)?.crop;
  if (own) return own;
  return OBJ.identities.find(x => oroot(x.id) === i && x.crop)?.crop || null;

  const optsIn = h('input', { type: 'text', placeholder: 'Categories, comma separated', style: 'flex:1' });
  const minIn = h('input', { type: 'number', placeholder: 'min', style: 'width:80px' }), maxIn = h('input', { type: 'number', placeholder: 'max', style: 'width:80px' });
  const targetIn = h('select', {}, h('option', { value: 'person' }, 'about a person'), h('option', { value: 'scene' }, 'about the scene'));
  const optsRow = h('div', { class: 'row' }, optsIn), rangeRow = h('div', { class: 'row' }, 'Range (optional)', minIn, maxIn);
  const showKind = () => { optsRow.style.display = kindIn.value === 'category' ? '' : 'none'; rangeRow.style.display = kindIn.value === 'number' ? '' : 'none'; };
  kindIn.addEventListener('change', showKind); showKind();
  for (const el of [nameIn, optsIn, minIn, maxIn]) el.addEventListener('keydown', e => e.stopPropagation());
  const addType = () => {
    const name = nameIn.value.trim(); if (!name) { toast('Give the type a name'); return; }
    const kind = kindIn.value, options = optsIn.value.split(',').map(s => s.trim()).filter(Boolean);
    if (kind === 'category' && options.length < 2) { toast('List at least two categories'); return; }
    const type = { id: `type:${Date.now()}`, name, kind, target: targetIn.value, options: kind === 'category' ? options : [] };
    if (kind === 'number') { if (minIn.value !== '') type.min = Number(minIn.value); if (maxIn.value !== '') type.max = Number(maxIn.value); }
    activeType = type.id;
    view.collapsed = view.collapsed.filter(k => k !== 'annotations'); saveView();
    commit({ op: 'annotation.type', type });
    toast(`“${name}” is now a timeline row. Drag across it to annotate.`);
  };
  const notes = [...S.notes.values()].sort((a, b) => a.start - b.start);
  if (!activeType || !typeOf(activeType)) activeType = S.types[0]?.id ?? null;
  const span = selection && selection.kind !== 'person' && selection.kind !== 'note' ? spanOf(selection) : null;
  const what = { utt: 'utterance', track: 'face track', sound: 'sound', text: 'text', shot: 'shot' };
  const addHere = activeType ? h('div', { class: 'list' },
    h('div', { class: 'row' }, 'Type', h('select', { onchange: e => { activeType = e.target.value; } }, ...S.types.map(t => h('option', { value: t.id, selected: t.id === activeType }, t.name)))),
    h('div', { class: 'row' },
      span ? h('button', { class: 'primary', onclick: () => addNote(activeType, span.start, span.end) }, `Annotate the selected ${what[selection.kind]} (${fmt(span.start)}–${fmt(span.end)})`) : null,
      h('button', { class: span ? '' : 'primary', onclick: () => { const s = shotAt(video.currentTime); addNote(activeType, s.start, s.end); } }, 'Annotate the current shot')),
    h('div', { class: 'meta' }, 'Or drag across the type’s row in the timeline, or press ', h('kbd', {}, '['), ' and ', h('kbd', {}, ']'), ' at the start and end while playing.')) : null;
  return [
    h('div', { class: 'meta' }, 'Your own annotations, kept apart from the machine track. Agents never receive a type unless an experiment turns it on.'),
    S.types.length ? [h('h3', {}, 'Add an annotation'), addHere] : null,
    h('h3', {}, `Annotations · ${notes.length}`),
    notes.length ? h('div', { class: 'list' }, ...notes.map(n => h('button', { class: `item ${isSel('note', n.id) ? 'selected' : ''}`, onclick: () => select('note', n.id) },
      h('span', { class: 'meta' }, fmt(n.start)), h('span', { class: 'grow' }, `${typeOf(n.type)?.name}: ${noteValue(n)}${n.person ? ` (${nameOf(root(n.person))})` : ''}`)))) : h('div', { class: 'empty' }, S.types.length ? 'None yet.' : 'Add a type first.'),
    h('h3', {}, 'Types'),
    S.types.length ? h('div', { class: 'list' }, ...S.types.map(t => h('div', { class: 'item' }, h('span', { class: 'grow' }, t.name),
      h('span', { class: 'meta' }, `${VALUE_KINDS[t.kind]}${t.kind === 'category' ? `: ${t.options.join(', ')}` : ''} · ${t.target === 'person' ? 'person' : 'scene'}`)))) : null,
    h('h3', {}, 'New type'),
    h('div', { class: 'row' }, nameIn), h('div', { class: 'row' }, 'Value', kindIn, targetIn), optsRow, rangeRow,
    h('div', { class: 'row' }, h('button', { onclick: addType }, 'Add type')),
  ];
}
function renderData() {
  const m = DATA.manifest;
  const size = b => b > 1e6 ? `${(b / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1e3))} kB`;
  return [
    h('div', { class: 'meta' }, 'Everything extracted for this video, including features the timeline does not draw. In HyperStudy each run is a versioned record you can compare with earlier runs and re-run; this prototype reads one run directory.'),
    h('div', { class: 'row meta' }, `Video ${DATA.clip} · sha256 ${DATA.sha256.slice(0, 12)}… · ${DATA.width}×${DATA.height} · ${fmt(DATA.duration)}`),
    ...m.stages.map(s => h('div', { class: 'stage-card' },
      h('div', { class: 'row', style: 'margin:0' }, h('b', {}, s.stage), h('span', { class: `badge ${s.licence_mode === 'academic-only' ? 'academic' : s.licence_mode === 'commercial-ok' ? 'commercial' : ''}`, title: s.licence }, s.licence_mode)),
      h('div', { class: 'meta' }, s.model),
      h('div', { class: 'meta' }, `${s.file} · ${size(s.bytes)} · run ${s.run_at}${s.seconds ? ` · took ${s.seconds} s` : ''}`),
      h('table', {}, ...s.features.map(f => h('tr', {}, h('td', {}, f.name), h('td', {}, f.shape)))),
      s.note ? h('div', { class: 'meta', style: 'margin-top:4px' }, s.note) : null)),
  ];
}
function renderPanel() {
  const panel = $('panel');
  const scroll = panel.scrollTop;
  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
    if (b.dataset.tab === 'review') { const q = queue(); b.textContent = `Review (${q.speakers.filter(u => !reviewed(u)).length + q.pairs.length})`; }
  });
  let content;
  if (tab === 'review') content = renderReview();
  else if (tab === 'people') content = renderPeople();
  else if (tab === 'notes') content = renderNotes();
  else if (tab === 'data') content = renderData();
  else if (!selection) content = viewNothing();
  else {
    const { kind, id } = selection;
    content = kind === 'track' ? viewTrack(tracksById.get(id)) : kind === 'person' ? viewPerson(id) : kind === 'utt' ? viewUtterance(uttsById.get(id))
      : kind === 'sound' ? viewSound(DATA.sounds.find(s => s.id === id)) : kind === 'text' ? viewText(DATA.texts.find(s => s.id === id))
      : kind === 'shot' ? viewShot(DATA.shots[id]) : kind === 'object' && objTrack(id) ? viewObject(objTrack(id)) : kind === 'objid' ? viewObjectIdentity(id)
      : kind === 'gesture' && DATA.hand_events ? viewGesture(id) : kind === 'facing' && facingFile() ? viewFacing(id)
      : kind === 'event' && DATA.event_sources ? viewEvent(id)
      : S.notes.has(id) ? viewNote(S.notes.get(id)) : viewNothing();
  }
  panel.replaceChildren(...[content].flat(Infinity).filter(Boolean));
  panel.scrollTop = scroll;
  const help = selection?.kind === 'utt'
    ? [h('kbd', {}, '1'), '–', h('kbd', {}, '9'), ' face  ', h('kbd', {}, 'o'), ' voice  ', h('kbd', {}, 'm'), ' several  ', h('kbd', {}, 'u'), ' unsure  ', h('kbd', {}, 'x'), ' not speech  ', h('kbd', {}, 'j'), '/', h('kbd', {}, 'k'), ' next/prev']
    : [h('kbd', {}, 'space'), ' play  ', h('kbd', {}, '←'), h('kbd', {}, '→'), ' 1 s  ', h('kbd', {}, ','), h('kbd', {}, '.'), ' shot  ', h('kbd', {}, 'e'), ' include  ', h('kbd', {}, '['), h('kbd', {}, ']'), ' annotate  ', h('kbd', {}, 'j'), ' review  ', h('kbd', {}, '⌥'), '-click segment'];
  $('help').replaceChildren(...help, '  ', h('kbd', {}, '⌘Z'), ' undo');
}
function render() {
  $('count').textContent = plural(ops.length, 'correction');
  $('undo').disabled = !ops.length;
  renderPanel(); renderTimeline(); drawOverlay();
}
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; renderPanel(); }));

// ---------- transport, keys, import/export ----------
function togglePlay() { playUntil = null; video.paused ? video.play() : video.pause(); }
$('play').addEventListener('click', togglePlay);
$('speed').addEventListener('change', e => { video.playbackRate = Number(e.target.value); });
video.addEventListener('play', () => { $('play').textContent = 'Pause'; tick(); });
video.addEventListener('pause', () => { $('play').textContent = 'Play'; });
let lastShot = -1;
function onTime() {
  if (video.paused) frameT = video.currentTime;
  const t = frameT, shot = shotAt(t);
  if (playUntil !== null && t >= playUntil) { video.pause(); playUntil = null; }
  $('time').textContent = `${fmt(t)} / ${fmt(DATA.duration)}`;
  $('shotinfo').textContent = `Shot ${shot.index + 1} of ${DATA.shots.length}`;
  drawOverlay(); movePlayhead();
  if (shot.index !== lastShot) { lastShot = shot.index; if (!selection && tab === 'inspect') renderPanel(); }
  const live = $('live');
  if (live && selection?.kind === 'track') { const tr = tracksById.get(selection.id); if (`${tr.id}:${sampleAt(tr, t)}` !== liveKey) fillLive(live, tr); }
  if (marking.start !== null && marking.end === null && !scrub) renderTimeline();
}
function tick() {   // one draw per presented video frame, at that frame's media time
  video.requestVideoFrameCallback((_now, meta) => { frameT = meta.mediaTime; onTime(); if (!video.paused) tick(); });
}
video.addEventListener('seeked', onTime);
video.addEventListener('pause', onTime);
video.addEventListener('loadedmetadata', onTime);
window.addEventListener('resize', () => { pps = fitPps() * Number($('zoom').value); render(); });

document.addEventListener('keydown', e => {
  if (e.target.closest?.('input, textarea, select')) return;
  const k = e.key, utt = selection?.kind === 'utt' ? uttsById.get(selection.id) : null;
  if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (k === ' ') { e.preventDefault(); const span = spanOf(selection); if (video.paused && span && selection.kind !== 'person' && selection.kind !== 'shot') playSpan(span); else togglePlay(); }
  else if (k === 'ArrowLeft' || k === 'ArrowRight') { e.preventDefault(); playUntil = null; video.currentTime = Math.max(0, Math.min(DATA.duration, video.currentTime + (k === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 5 : 1))); }
  else if (k === ',' || k === '.') { const i = shotAt(video.currentTime).index + (k === ',' ? -1 : 1); if (DATA.shots[i]) video.currentTime = DATA.shots[i].start + 0.01; }
  else if (k === 'j' || k === 'k') { tab = 'review'; nextInQueue(k === 'j' ? 1 : -1); }
  else if (k === 'Escape') { selection = null; render(); }
  else if (k === '[') { if (!S.types.length) { tab = 'notes'; render(); toast('Add an annotation type first'); return; } marking = { start: video.currentTime, end: null }; renderTimeline(); toast('Start marked; press ] at the end'); }
  else if (k === ']') { if (marking.start !== null && activeType) { const a = marking.start, b = video.currentTime; addNote(activeType, Math.min(a, b), Math.max(a, b)); } }
  else if (k === 'e' && selection) {
    const { kind, id } = selection, key = kind === 'track' ? `track:${id}` : kind === 'person' ? `person:${id}` : kind === 'utt' ? `utt:${id}` : kind === 'shot' ? `shot:${id}`
      : kind === 'object' ? `objtrack:${id}` : kind === 'objid' ? `object:${id}` : id;
    const item = kind === 'track' ? tracksById.get(id) : kind === 'utt' ? uttsById.get(id) : kind === 'sound' ? DATA.sounds.find(s => s.id === id) : kind === 'text' ? DATA.texts.find(s => s.id === id)
      : kind === 'shot' ? DATA.shots[id] : kind === 'object' ? objTrack(id) : id;
    if (kind !== 'note') commit({ op: 'entity.include', id: key, included: !included(kind, item) });
  }
  else if (utt && /^[1-9]$/.test(k)) { const c = utt.candidates[Number(k) - 1]; if (c) setSpeaker(utt, { kind: 'face', track: c.track }); }
  else if (utt && k === 'o') setSpeaker(utt, { kind: 'offscreen', voice: utt.voice });
  else if (utt && k === 'm') setSpeaker(utt, { kind: 'multiple' });
  else if (utt && k === 'u') setSpeaker(utt, { kind: 'unsure' });
  else if (utt && k === 'x') setSpeaker(utt, { kind: 'not_speech' });
});

$('undo').addEventListener('click', undo);
$('export').addEventListener('click', () => {
  const doc = { format: 'perception-corrections/1', clip: DATA.clip, sha256: DATA.sha256, sources: DATA.sources, exported_at: new Date().toISOString(), ops };
  const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(doc, null, 2)], { type: 'application/json' })), download: 'perception_corrections.json' });
  document.body.append(a); a.click(); a.remove();
});
$('import').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const doc = JSON.parse(await f.text());
    if (doc.sha256 !== DATA.sha256) { toast('That file is for a different video'); return; }
    ops = doc.ops; persist(); fold(); render(); toast(`Imported ${plural(ops.length, 'correction')}`);
  } catch { toast('Could not read that file'); }
  e.target.value = '';
});

$('sub').textContent = `${DATA.clip} · ${DATA.shots.length} shots · ${DATA.utterances.length} utterances · ${DATA.tracks.length} face tracks · ${DATA.sounds.length} sound events`;
$('sub').title = Object.entries(DATA.sources).map(([k, v]) => `${k}: ${v}`).join('\n');
fold();
pps = fitPps();
renderLayers();
renderGroupChips();
if (view.layers.mesh && DATA.face_detail?.mesh) loadMesh();
if (view.layers.skeleton && view.poseModel) loadPose(view.poseModel);
if (view.layers.hands && view.handModel) loadHands(view.handModel);
render();
onTime();
</script>
</body>
