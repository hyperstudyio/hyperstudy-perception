# Everything the pipeline can do: the graph the annotator app runs. The app's feature list picks what runs (--only, with
# what it needs), settings (--set) and places (--place). Nothing leaves the machine without --allow-uploads, and then
# only the kinds allow_upload names: frames, faces and transcript for the captions API, and video and audio for a step
# placed on another machine (a lab server, a cloud GPU), which receives its inputs. Embeddings too: the faces layer
# holds ArcFace identity distances (person_pairs), and every step that reads it (bodies, gaze, hands...) receives it
# when placed elsewhere; the run's consent still names it per step. max_cost_usd caps the spend.
#   perception plan graphs/full.yaml --input video=PATH/TO/VIDEO.mp4
#   perception run graphs/full.yaml --input video=PATH --only asr,faces          # the local, free features
#   perception run graphs/full.yaml --input video=PATH --allow-uploads           # everything, captions too
schema_version: 1
pipeline: perception-full
inputs:
  video: {type: video.v1, uri: '../data/video.mp4'}
policy:
  placement: hybrid
  privacy: local-preferred
  allow_upload: [video, audio, frames, faces, transcript, embeddings]
  max_cost_usd: 0.50
  retries: 1
nodes:
  - id: decode
    uses: core.decode@1.0.0
    inputs: {video: $inputs.video}
  - id: asr
    uses: audio.asr@1.0.0
    inputs: {audio: $nodes.decode.audio, shots: $nodes.decode.shots}
  # refines asr's transcript: the same words and utterances, with their voices (pyannote; gated, HF_TOKEN)
  - id: diarize
    uses: audio.diarize@1.0.0
    inputs: {audio: $nodes.decode.audio, transcript: $nodes.asr.transcript}
  - id: sounds
    uses: audio.sounds@1.0.0
    inputs: {video: $inputs.video}
  - id: waveform
    uses: audio.waveform@1.0.0
    inputs: {audio: $nodes.decode.audio}
  - id: faces
    uses: vision.face-track@1.4.0
    inputs: {video: $inputs.video, media: $nodes.decode.media, shots: $nodes.decode.shots}
  - id: bodies
    uses: vision.body-pose@1.0.0
    inputs: {video: $inputs.video, media: $nodes.decode.media, shots: $nodes.decode.shots, faces: $nodes.faces.faces}
  - id: gaze
    uses: vision.gaze@1.1.0
    inputs: {video: $inputs.video, media: $nodes.decode.media, faces: $nodes.faces.faces}
  # the speech it reads is diarized, as the bake-off's captions read it: lines by voice (SPEAKER_00, ...), not one SPEAKER
  - id: captions
    uses: vlm.shot-captions@1.0.0
    inputs: {shots: $nodes.decode.shots, keyframes: $nodes.decode.keyframes, transcript: $nodes.diarize.transcript,
             faces: $nodes.faces.faces, media: $nodes.decode.media}
