name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    # Fork and bot pull requests get no repository secrets, so the action could not authenticate: skip them rather
    # than show a red X that only means "no credential".
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # A review that cannot authenticate must fail, not pass with nothing reviewed.
      - name: Refuse to review without a credential
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set on this repository."
            echo "Generate one with \`claude setup-token\` and add it as a repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # A Claude plan credential (claude setup-token), so reviews use plan usage rather than API credits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out. Read PLAN.md,
            docs/plans/PERCEPTION_GRAPH_SPEC.md and docs/plans/GRAPH_MVP_PLAN.md before judging the diff:
            decisions are recorded beside the code that implements them, and most real defects here undo
            one of them rather than being ordinary bugs.

            Weight your attention in this order:

            1. **Nothing that must not leave the lab.** Study videos, audio, frames and face crops are often
               copyrighted or identifiable; API keys and tokens are secrets. None may appear in code,
               fixtures, tests, docs or logged output. Flag the FILE and say a human must check it; never
               quote a suspected secret.

            2. **Privacy policy.** A node that sends any data off the machine must declare every kind in its
               manifest's `privacy.external_upload`, and graphs must only run it when `policy.allow_upload`
               permits each kind (`ir.py`). An upload the manifest does not declare is the most serious
               defect a node can have.

            3. **Cache identity.** Anything that changes a node's output must be in its cache key: runner
               identity (environment lock, node code, SDK), config, input hashes and output types. Stored
               layers must be deterministic: no run times or timings inside layer content (export adds them).
               A missing key component silently serves stale results.

            4. **Paths and links.** Node outputs and bundle paths are read without following symlinks and
               never leave their directory (`output_path`, `publish`, `collect`). Containers mount only the
               attempt's own folder.

            5. **Run state.** `store.py` migrations are append-only and numbered: a new one takes the next
               free version and is appended. Attempt numbers only increase; leases and adoption after a crash
               must not run a node twice.

            6. **Spend and cloud machines.** Billable nodes declare `cost`; the estimate is reserved against
               `max_cost_usd` before the node starts. Cloud tasks must give machines no AWS credentials, delete
               them after the job, and keep a shutdown deadline as a backstop. Nothing may leave a GPU machine,
               disk or endpoint running.

            7. **House rules.** Root cause over workarounds: no retries, sleeps or silent fallbacks standing in
               for understanding. Every bug fix ships with a test that fails before it.

            Report findings as `file:line — summary` with a concrete failure scenario: specific inputs or
            state leading to a wrong outcome. Rank most severe first and label each MAJOR / MEDIUM / MINOR.
            If nothing survives scrutiny, say so plainly rather than inventing findings.

            Use `gh pr comment` for top-level feedback and
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for specific code
            issues. Only post GitHub comments; do not return review text as a message. A review that is not
            posted did not happen.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
